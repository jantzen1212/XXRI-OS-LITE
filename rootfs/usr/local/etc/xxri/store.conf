# xxri-store engine configuration.
#
# Every setting uses ${VAR:=default}, so the environment wins over this file:
#   REMOTE_BASE=http://mirror.lan/store xxri-store refresh
# That is how a site mirror, a staging repository or a QA run points the Store
# somewhere else without editing the shipped image.

# The online repository is the ONLY source of application metadata.  Nothing is
# bundled into the OS and nothing is generated locally; the Store is a client.
: "${REPO_URL:=https://repo.xxri.flows.best/i686.json}"
: "${REMOTE_BASE:=https://repo.xxri.flows.best}"

# How old the cached repository may get before a refresh is due (seconds).
: "${CACHE_MAX_AGE:=86400}"

# Native extension repository. Apps published as .tcz (the mainstream desktop
# software that upstream no longer builds 32-bit AppImages for) are pulled from
# here along with their dependency chain.
: "${TCZ_BASE:=http://repo.tinycorelinux.net/16.x/x86/tcz}"
