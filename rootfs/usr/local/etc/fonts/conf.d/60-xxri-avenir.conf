<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- xxri OS Lite system font: Avenir Next as the default family.
     Installed dormant; becomes active as soon as a fontconfig-based
     toolkit (GTK/Qt) is added through xxri-pkg. -->
<fontconfig>
  <dir>/usr/local/share/fonts</dir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Avenir Next</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Avenir Next</family></prefer>
  </alias>
</fontconfig>
