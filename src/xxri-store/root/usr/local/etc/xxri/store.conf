# xxri-store engine configuration.
#
# Every setting uses ${VAR:=default}, so the environment wins over this file
# (a mirror, staging repository or QA run needs no image change):
#   REMOTE_BASE=http://mirror.lan/store xxri-store refresh

# The repository. The catalog is chosen by the OS's architecture, not here:
# REMOTE_BASE/i686.json on a 32-bit OS, REMOTE_BASE/x64.json on a 64-bit one.
# Setting REPO_URL overrides that (a mirror or a staging catalog); the file it
# serves must still be a catalog of this OS's architecture or it is rejected.
: "${REMOTE_BASE:=https://repo.xxri.flows.best}"

# How old the cached repository may get before a refresh is due (seconds).
: "${CACHE_MAX_AGE:=86400}"

# Tiny Core extension mirror, for apps published as .tcz (no 32-bit AppImage
# upstream) and their dependency chains. Defaults to 16.x/x86/tcz or
# 16.x/x86_64/tcz, by architecture.
