<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- xxri OS Lite: Arabic script. Avenir Next has no Arabic glyphs, so the
     text falls back to Noto Sans Arabic (UI, sans-serif) or Noto Naskh Arabic
     (serif, running text). Latin text keeps Avenir Next: "accept" adds them
     behind the preferred family, it does not replace it. Pango and Qt shape
     and join the letters with HarfBuzz once a font has the glyphs. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <accept><family>Noto Sans Arabic</family></accept>
  </alias>
  <alias>
    <family>system-ui</family>
    <accept><family>Noto Sans Arabic</family></accept>
  </alias>
  <alias>
    <family>Avenir Next</family>
    <accept><family>Noto Sans Arabic</family></accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept><family>Noto Naskh Arabic</family></accept>
  </alias>
  <!-- a document or page that says it is Arabic gets the Arabic faces first -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Naskh Arabic</string></edit>
  </match>
</fontconfig>
