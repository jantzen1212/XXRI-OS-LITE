# Xorg on a KMS device inside a hypervisor (~/.xsession in_vm passes this with
# -config).  The virtual GPU's hardware cursor is often never displayed, so the
# pointer is drawn by the server.  Acceleration (glamor) is left as it was.
# An OutputClass would be the tidier way, but XLibre 25.1.9's i686 build
# segfaults in xf86BusProbe as soon as one is present.
Section "Device"
    Identifier "xxri-kms"
    Driver "modesetting"
    Option "SWcursor" "true"
EndSection
